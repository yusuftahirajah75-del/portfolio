[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Route all incoming requests to index.html with HTTP status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets with immutable hashing
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and documents with stale-while-revalidate
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
